<!-- Dark mode toggle: swaps in the theme's own light/dark stylesheet
     (follows the system preference until the button is used; the choice persists in localStorage).
     The theme minifies pages onto one line, so no // comments inside this script. -->
<script>
(function() {
  const LS_KEY = 'jtd-color-scheme';
  const CSS_BASE = '{{ "/assets/css/just-the-docs-" | relative_url }}';
  const root = document.documentElement;
  const sheet = document.querySelector('link[rel="stylesheet"]');
  const media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  let loaded = 'light'; /* the page ships with the light stylesheet */

  function saved() {
    try { return localStorage.getItem(LS_KEY); } catch (e) { return null; }
  }

  function apply(scheme) {
    root.dataset.theme = scheme;
    if (sheet && scheme !== loaded) {
      sheet.setAttribute('href', CSS_BASE + scheme + '.css');
      loaded = scheme;
    }
  }

  apply(saved() === 'dark' || (!saved() && media && media.matches) ? 'dark' : 'light');

  if (media && media.addEventListener) {
    media.addEventListener('change', function(e) {
      if (!saved()) apply(e.matches ? 'dark' : 'light');
    });
  }

  window.toggleColorScheme = function() {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    apply(next);
    try { localStorage.setItem(LS_KEY, next); } catch (e) {}
  };

  document.addEventListener('DOMContentLoaded', function() {
    const btn = document.createElement('button');
    btn.className = 'theme-toggle';
    btn.type = 'button';
    btn.title = 'Toggle dark mode';
    btn.setAttribute('aria-label', 'Toggle dark mode');
    btn.onclick = window.toggleColorScheme;
    btn.textContent = root.dataset.theme === 'dark' ? '☾' : '☼';

    const obs = new MutationObserver(() => {
      btn.textContent = root.dataset.theme === 'dark' ? '☾' : '☼';
    });
    obs.observe(root, { attributes: true, attributeFilter: ['data-theme'] });

    (document.querySelector('.site-header') || document.body).appendChild(btn);
  });
})();
</script>
