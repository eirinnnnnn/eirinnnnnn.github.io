title: "Eirin ouo"
description: "Communication engineering, information theory, and math notes."

url: "https://eirinnnnnn.github.io"
baseurl: ""

# Kept in the repo, but not built into the site
exclude:
  - prof.md

# Theme
remote_theme: just-the-docs/just-the-docs

# Links in the top-right corner
aux_links:
  "GitHub":
    - "https://github.com/eirinnnnnn"
aux_links_new_tab: true

# Markdown engine
markdown: kramdown
kramdown:
  input: GFM

# GitHub Pages build helpers
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-feed
